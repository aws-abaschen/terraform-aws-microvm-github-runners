version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ["github.com/aws/*"]
  - package-ecosystem: github-actions
    directories: ["/", "/examples/consumer-repo"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directories: ["/modules/*", "/examples/*", "/examples/consumer-repo/infra/runners"]
    schedule:
      interval: weekly
