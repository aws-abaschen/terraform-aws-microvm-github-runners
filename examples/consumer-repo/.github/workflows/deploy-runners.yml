# Deploys this repository's MicroVM runners. Runs on GitHub-hosted runners so
# the runners never deploy themselves. Requires the "runners" Environment with
# required reviewers and a main-only deployment branch rule.
name: deploy-runners

on:
  push:
    branches: [main]
    paths: ["infra/runners/**", ".github/workflows/deploy-runners.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  attestations: read

concurrency:
  group: deploy-runners
  cancel-in-progress: false

env:
  RELEASE: v0.1.0
  SOURCE_REPO: aws-abaschen/terraform-aws-microvm-github-runners
  TF_DIR: infra/runners
  AWS_REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$TF_DIR/.release"
          gh release download "$RELEASE" --repo "$SOURCE_REPO" --dir "$TF_DIR/.release" \
            --pattern lambda.zip --pattern image-arm64.zip --pattern SHA256SUMS
          (cd "$TF_DIR/.release" && sha256sum --ignore-missing -c SHA256SUMS)
          for f in lambda.zip image-arm64.zip; do
            gh attestation verify "$TF_DIR/.release/$f" --repo "$SOURCE_REPO"
          done

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RUNNERS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-runners-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2

      - name: Plan
        run: |
          terraform -chdir="$TF_DIR" init -input=false \
            -backend-config="bucket=${{ vars.RUNNERS_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.RUNNERS_STATE_KEY }}" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir="$TF_DIR" plan -input=false -var "region=$AWS_REGION" -var "repository=$GITHUB_REPOSITORY" -out=tfplan
          terraform -chdir="$TF_DIR" show -no-color tfplan > "$TF_DIR/plan.txt"

      # Change record (DORA Art. 9): the plan applied is the plan archived.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            ${{ env.TF_DIR }}/plan.txt
            ${{ env.TF_DIR }}/.release/SHA256SUMS
          retention-days: 400

      - name: Apply
        run: terraform -chdir="$TF_DIR" apply -input=false tfplan
